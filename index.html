<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEON SNAKE · 霓虹贪吃蛇</title>
    <style>
        :root {
            --ink: #e8ecff;
            --muted: #8b93b8;
            --cyan: #22d3ee;
            --violet: #8b5cf6;
            --pink: #ff2e63;
            --gold: #ffd166;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 28px 16px 34px;
            color: var(--ink);
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
            background:
                radial-gradient(1100px 780px at 12% 8%, #17204a 0%, transparent 62%),
                radial-gradient(980px 720px at 88% 92%, #3a0f3d 0%, transparent 60%),
                linear-gradient(160deg, #05060f 0%, #0b0f24 55%, #060812 100%);
            overflow-x: hidden;
        }

        /* 背景里缓慢漂移的极光光斑 */
        .aurora {
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            opacity: .45;
            pointer-events: none;
            z-index: 0;
            animation: drift 20s ease-in-out infinite alternate;
        }
        .aurora.a { width: 420px; height: 420px; background: var(--cyan);   top: -90px;     left: -70px; }
        .aurora.b { width: 500px; height: 500px; background: var(--pink);   bottom: -160px; right: -90px; animation-duration: 26s; }
        .aurora.c { width: 360px; height: 360px; background: var(--violet); top: 42%;       left: 58%;   animation-duration: 32s; opacity: .32; }

        @keyframes drift {
            from { transform: translate3d(0, 0, 0) scale(1); }
            to   { transform: translate3d(70px, -46px, 0) scale(1.18); }
        }

        .game-shell {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .title {
            font-size: clamp(2rem, 5.2vw, 3.3rem);
            font-weight: 800;
            letter-spacing: .18em;
            text-align: center;
            background: linear-gradient(90deg, var(--cyan), var(--violet), var(--pink), var(--gold), var(--cyan));
            background-size: 300% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: shimmer 7s linear infinite, titleIn .9s ease both;
        }

        @keyframes shimmer {
            to { background-position: 300% 0; }
        }

        @keyframes titleIn {
            from { opacity: 0; transform: translateY(-14px) scale(.96); }
            to   { opacity: 1; transform: none; }
        }

        .subtitle {
            margin-top: 8px;
            text-align: center;
            font-size: .82rem;
            letter-spacing: .08em;
            color: var(--muted);
        }

        .stats {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .stat {
            min-width: 108px;
            padding: 9px 18px;
            text-align: center;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, .09);
            background: rgba(255, 255, 255, .045);
            backdrop-filter: blur(8px);
            box-shadow: 0 10px 24px rgba(0, 0, 0, .3);
        }

        .stat .label {
            display: block;
            font-size: .64rem;
            letter-spacing: .2em;
            color: var(--muted);
        }

        .stat .value {
            display: block;
            margin-top: 2px;
            font-size: 1.45rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        #scoreCard .value { color: #7ef1ff; text-shadow: 0 0 16px rgba(126, 241, 255, .55); }
        #levelCard .value { color: #c4b5fd; text-shadow: 0 0 16px rgba(196, 181, 253, .55); }
        #highCard  .value { color: #ffd166; text-shadow: 0 0 16px rgba(255, 209, 102, .5); }

        .stat.bump { animation: bump .45s ease; }

        @keyframes bump {
            0%   { transform: scale(1); }
            38%  { transform: scale(1.15); border-color: rgba(126, 241, 255, .65); box-shadow: 0 0 26px rgba(126, 241, 255, .45); }
            100% { transform: scale(1); }
        }

        .board {
            position: relative;
            width: min(600px, 86vw, 68vh);
            aspect-ratio: 1 / 1;
            padding: 10px;
            border-radius: 24px;
            background: linear-gradient(145deg, rgba(34, 211, 238, .38), rgba(139, 92, 246, .38), rgba(255, 46, 99, .38));
            box-shadow: 0 26px 60px rgba(0, 0, 0, .55), 0 0 70px rgba(80, 120, 255, .16);
            animation: boardIn .85s ease both;
        }

        @keyframes boardIn {
            from { opacity: 0; transform: translateY(20px) scale(.97); }
            to   { opacity: 1; transform: none; }
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            border-radius: 15px;
            background: #0a0f26;
        }

        .overlay {
            position: absolute;
            inset: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 15px;
            background: rgba(5, 6, 15, .74);
            backdrop-filter: blur(7px);
            opacity: 0;
            visibility: hidden;
            transition: opacity .35s ease, visibility .35s ease;
        }

        .overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .panel {
            padding: 26px 44px;
            text-align: center;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, .12);
            background: rgba(12, 16, 38, .9);
            box-shadow: 0 20px 50px rgba(0, 0, 0, .55), 0 0 40px rgba(255, 46, 99, .22);
            transform: translateY(18px) scale(.93);
            transition: transform .4s cubic-bezier(.2, .9, .25, 1.2);
        }

        .overlay.show .panel {
            transform: none;
        }

        .badge {
            display: none;
            margin-bottom: 12px;
            padding: 4px 14px;
            border-radius: 999px;
            font-size: .66rem;
            font-weight: 800;
            letter-spacing: .22em;
            color: #14100a;
            background: linear-gradient(90deg, var(--gold), #a3e635);
        }

        .badge.show {
            display: inline-block;
            animation: badgePop .55s ease;
        }

        @keyframes badgePop {
            0%   { transform: scale(.5) rotate(-6deg); opacity: 0; }
            70%  { transform: scale(1.12) rotate(2deg); opacity: 1; }
            100% { transform: scale(1) rotate(0); }
        }

        .panel h2 {
            font-size: 2rem;
            letter-spacing: .16em;
            color: var(--pink);
            text-shadow: 0 0 22px rgba(255, 46, 99, .55);
        }

        .panel .final {
            margin: 12px 0 20px;
            font-size: 1rem;
            color: var(--muted);
        }

        .panel .final span {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--gold);
        }

        .panel .tip {
            margin-top: 14px;
            font-size: .74rem;
            color: var(--muted);
        }

        .btn {
            display: inline-block;
            padding: 12px 36px;
            border: none;
            border-radius: 999px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: .1em;
            color: #fff;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            background: linear-gradient(135deg, var(--cyan), var(--violet) 55%, var(--pink));
            box-shadow: 0 12px 28px rgba(139, 92, 246, .45);
            transition: transform .2s ease, box-shadow .2s ease;
        }

        .btn:hover {
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 18px 36px rgba(255, 46, 99, .42);
        }

        .btn:active {
            transform: translateY(0) scale(.98);
        }

        .btn.ghost {
            border: 1px solid rgba(255, 255, 255, .22);
            background: transparent;
            color: var(--ink);
            box-shadow: none;
        }

        .btn.ghost:hover {
            border-color: var(--cyan);
            color: #fff;
            box-shadow: 0 0 24px rgba(34, 211, 238, .35);
        }

        .panel-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .controls {
            font-size: .84rem;
            color: var(--muted);
            text-align: center;
            line-height: 2;
        }

        .controls .sep {
            margin: 0 8px;
            color: rgba(255, 255, 255, .22);
        }

        .controls a {
            padding-bottom: 1px;
            color: #7ef1ff;
            text-decoration: none;
            border-bottom: 1px solid rgba(126, 241, 255, .35);
            transition: color .2s ease, border-color .2s ease;
        }

        .controls a:hover {
            color: #fff;
            border-color: #fff;
        }

        kbd {
            display: inline-block;
            margin: 0 1px;
            padding: 1px 7px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, .16);
            border-bottom-width: 2px;
            background: rgba(255, 255, 255, .08);
            font-family: inherit;
            font-size: .78rem;
            color: var(--ink);
        }

        @media (prefers-reduced-motion: reduce) {
            .aurora, .title, .board, .stat.bump, .badge.show { animation: none; }
        }
    </style>
</head>
<body>
    <div class="aurora a"></div>
    <div class="aurora b"></div>
    <div class="aurora c"></div>

    <main class="game-shell">
        <header>
            <h1 class="title">NEON SNAKE</h1>
            <p class="subtitle">霓虹贪吃蛇 · 单文件纯前端实现，无需构建</p>
        </header>

        <section class="stats">
            <div class="stat" id="scoreCard"><span class="label">SCORE</span><span class="value" id="score">0</span></div>
            <div class="stat" id="levelCard"><span class="label">LEVEL</span><span class="value" id="level">1</span></div>
            <div class="stat" id="highCard"><span class="label">BEST</span><span class="value" id="highScore">0</span></div>
        </section>

        <section class="board">
            <canvas id="gameCanvas" width="600" height="600"></canvas>
            <div class="overlay" id="gameOver">
                <div class="panel">
                    <span class="badge" id="recordBadge">NEW RECORD</span>
                    <h2>GAME OVER</h2>
                    <p class="final">本局得分 <span id="finalScore">0</span></p>
                    <div class="panel-actions">
                        <button class="btn" onclick="resetGame()">再来一局</button>
                        <a class="btn ghost" href="scores.html">查看成绩记录</a>
                    </div>
                    <p class="tip">或按 <kbd>Enter</kbd> 快速重开</p>
                </div>
            </div>
        </section>

        <p class="controls">
            <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> 或 <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 控制方向
            <span class="sep">·</span>
            <a href="scores.html">查看成绩记录 →</a>
        </p>
    </main>

    <script>
        (function () {
            'use strict';

            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const scoreElement = document.getElementById('score');
            const scoreCard = document.getElementById('scoreCard');
            const levelElement = document.getElementById('level');
            const levelCard = document.getElementById('levelCard');
            const highScoreElement = document.getElementById('highScore');
            const highCard = document.getElementById('highCard');
            const gameOverElement = document.getElementById('gameOver');
            const finalScoreElement = document.getElementById('finalScore');
            const recordBadge = document.getElementById('recordBadge');

            /* ---------------- 基础参数 ---------------- */
            const SIZE = 600;                    // 逻辑画布边长（CSS 像素）
            const gridSize = 30;                 // 每格像素
            const tileCount = SIZE / gridSize;   // 20 × 20 格
            const START_SPEED = 130;             // 每步毫秒数，越小越快
            const MIN_SPEED = 65;
            const SPEED_STEP = 11;
            const LEVEL_STEP = 50;               // 每 50 分升一级

            // 高分屏按设备像素比放大，画面更清晰
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            canvas.width = SIZE * dpr;
            canvas.height = SIZE * dpr;
            ctx.scale(dpr, dpr);

            /* ---------------- 游戏状态 ---------------- */
            let snake = [];
            let prevSnake = [];      // 上一步的位置，用来插值出顺滑移动
            let food = { x: 13, y: 10 };
            let dx = 1, dy = 0, nextDx = 1, nextDy = 0;
            let score = 0;
            let level = 1;
            let speed = START_SPEED;
            let highScore = Number(localStorage.getItem('snakeHighScore') || 0) || 0;
            let bestAtStart = highScore;
            let gameRunning = true;
            let stepProgress = 0;
            let lastFrame = 0;
            let animTime = 0;
            let shake = 0;
            let particles = [];
            let rings = [];
            let floaters = [];

            highScoreElement.textContent = highScore;

            /* ---------------- 小工具 ---------------- */
            function unit(x, y) {
                const len = Math.hypot(x, y) || 1;
                return { x: x / len, y: y / len };
            }

            function bump(element) {
                element.classList.remove('bump');
                void element.offsetWidth;   // 强制重排，让动画能重新播放
                element.classList.add('bump');
            }

            function cellCenter(cell) {
                return {
                    x: cell.x * gridSize + gridSize / 2,
                    y: cell.y * gridSize + gridSize / 2
                };
            }

            /* ---------------- 特效 ---------------- */
            function spawnBurst(pos, count, hue) {
                for (let i = 0; i < count; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const power = 40 + Math.random() * 150;
                    particles.push({
                        x: pos.x,
                        y: pos.y,
                        vx: Math.cos(angle) * power,
                        vy: Math.sin(angle) * power,
                        life: 0.5 + Math.random() * 0.5,
                        maxLife: 1,
                        size: 1.6 + Math.random() * 3.2,
                        hue: hue + (Math.random() * 50 - 25)
                    });
                }
            }

            function updateEffects(dt) {
                const seconds = dt / 1000;
                animTime += seconds;

                if (shake > 0.4) {
                    shake *= Math.pow(0.9, dt / 16);
                } else {
                    shake = 0;
                }

                const damp = Math.pow(0.94, dt / 16);
                particles = particles.filter(p => {
                    p.life -= seconds;
                    if (p.life <= 0) return false;
                    p.x += p.vx * seconds;
                    p.y += p.vy * seconds;
                    p.vx *= damp;
                    p.vy = p.vy * damp + 70 * seconds;
                    return true;
                });

                rings = rings.filter(r => {
                    r.life -= seconds * 1.7;
                    r.r += (r.maxR - r.r) * Math.min(1, seconds * 7);
                    return r.life > 0;
                });

                floaters = floaters.filter(f => {
                    f.life -= seconds * 1.05;
                    f.y -= 36 * seconds;
                    return f.life > 0;
                });
            }

            /* ---------------- 玩法逻辑 ---------------- */
            function update() {
                dx = nextDx;
                dy = nextDy;

                const head = { x: snake[0].x + dx, y: snake[0].y + dy };

                // 撞墙
                if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                    die();
                    return;
                }

                // 撞到自己（尾巴这一步会移开，所以最后一节不算）
                for (let i = 0; i < snake.length - 1; i++) {
                    if (head.x === snake[i].x && head.y === snake[i].y) {
                        die();
                        return;
                    }
                }

                prevSnake = snake.map(s => ({ x: s.x, y: s.y }));
                snake.unshift(head);

                if (head.x === food.x && head.y === food.y) {
                    eat();
                } else {
                    snake.pop();
                }
            }

            function eat() {
                score += 10;
                scoreElement.textContent = score;
                bump(scoreCard);

                const pos = cellCenter(food);
                floaters.push({ x: pos.x, y: pos.y, text: '+10', life: 1, hue: 45 });
                rings.push({ x: pos.x, y: pos.y, r: gridSize * 0.4, maxR: gridSize * 2.6, life: 1, hue: 45 });
                spawnBurst(pos, 20, 38);

                if (score > highScore) {
                    highScore = score;
                    highScoreElement.textContent = highScore;
                    localStorage.setItem('snakeHighScore', highScore);
                    bump(highCard);
                }

                const nextLevel = 1 + Math.floor(score / LEVEL_STEP);
                if (nextLevel !== level) {
                    level = nextLevel;
                    levelElement.textContent = level;
                    bump(levelCard);
                    const center = { x: SIZE / 2, y: SIZE / 2 };
                    floaters.push({ x: center.x, y: center.y, text: 'LEVEL ' + level, life: 1.35, hue: 285 });
                    rings.push({ x: center.x, y: center.y, r: gridSize, maxR: SIZE * 0.7, life: 1, hue: 285 });
                }

                speed = Math.max(MIN_SPEED, START_SPEED - (level - 1) * SPEED_STEP);
                placeFood();
            }

            function placeFood() {
                const occupied = new Set(snake.map(s => s.x + ',' + s.y));
                const free = [];
                for (let x = 0; x < tileCount; x++) {
                    for (let y = 0; y < tileCount; y++) {
                        if (!occupied.has(x + ',' + y)) free.push({ x: x, y: y });
                    }
                }
                if (!free.length) return;   // 整屏占满时保持原位
                const pick = free[Math.floor(Math.random() * free.length)];
                food = { x: pick.x, y: pick.y };
            }

            function die() {
                gameRunning = false;
                shake = 18;
                prevSnake = snake.map(s => ({ x: s.x, y: s.y }));
                stepProgress = 1;

                snake.forEach((seg, index) => {
                    spawnBurst(cellCenter(seg), 8, (200 + index * 14) % 360);
                });

                finalScoreElement.textContent = score;
                if (score > 0 && score >= bestAtStart) {
                    recordBadge.classList.add('show');
                }
                gameOverElement.classList.add('show');
            }

            function resetGame() {
                snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
                prevSnake = snake.map(s => ({ x: s.x, y: s.y }));
                dx = 1; dy = 0; nextDx = 1; nextDy = 0;
                score = 0;
                level = 1;
                speed = START_SPEED;
                stepProgress = 0;
                shake = 0;
                particles = [];
                rings = [];
                floaters = [];
                gameRunning = true;
                bestAtStart = highScore;

                scoreElement.textContent = '0';
                levelElement.textContent = '1';
                gameOverElement.classList.remove('show');
                recordBadge.classList.remove('show');
                placeFood();
            }

            window.resetGame = resetGame;   // 按钮的 onclick 需要全局函数

            /* ---------------- 绘制 ---------------- */
            function drawBackground() {
                const gradient = ctx.createLinearGradient(0, 0, SIZE, SIZE);
                gradient.addColorStop(0, '#070a18');
                gradient.addColorStop(0.5, '#0a0f26');
                gradient.addColorStop(1, '#0c0722');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, SIZE, SIZE);

                // 中央缓缓呼吸的光晕
                const breathe = 0.1 + 0.035 * Math.sin(animTime * 0.9);
                const halo = ctx.createRadialGradient(SIZE / 2, SIZE / 2, 40, SIZE / 2, SIZE / 2, SIZE * 0.78);
                halo.addColorStop(0, 'rgba(96,132,255,' + breathe + ')');
                halo.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = halo;
                ctx.fillRect(0, 0, SIZE, SIZE);

                // 网格
                ctx.lineWidth = 1;
                ctx.strokeStyle = 'rgba(150,180,255,0.06)';
                ctx.beginPath();
                for (let i = 1; i < tileCount; i++) {
                    const p = i * gridSize;
                    ctx.moveTo(p, 0);
                    ctx.lineTo(p, SIZE);
                    ctx.moveTo(0, p);
                    ctx.lineTo(SIZE, p);
                }
                ctx.stroke();

                ctx.strokeStyle = 'rgba(150,180,255,0.13)';
                ctx.beginPath();
                for (let i = 5; i < tileCount; i += 5) {
                    const p = i * gridSize;
                    ctx.moveTo(p, 0);
                    ctx.lineTo(p, SIZE);
                    ctx.moveTo(0, p);
                    ctx.lineTo(SIZE, p);
                }
                ctx.stroke();

                // 自上而下缓缓扫过的光带
                const bandY = ((animTime * 95) % (SIZE + 260)) - 130;
                const band = ctx.createLinearGradient(0, bandY - 90, 0, bandY + 90);
                band.addColorStop(0, 'rgba(120,255,255,0)');
                band.addColorStop(0.5, 'rgba(120,255,255,0.055)');
                band.addColorStop(1, 'rgba(120,255,255,0)');
                ctx.fillStyle = band;
                ctx.fillRect(0, bandY - 90, SIZE, 180);
            }

            // 用插值算出每节身体此刻的屏幕坐标，让移动连续顺滑
            function snakePoints(t) {
                const points = [];
                for (let i = 0; i < snake.length; i++) {
                    const current = snake[i];
                    const previous = i < prevSnake.length
                        ? prevSnake[i]
                        : prevSnake[prevSnake.length - 1] || current;
                    points.push({
                        x: (previous.x + (current.x - previous.x) * t) * gridSize + gridSize / 2,
                        y: (previous.y + (current.y - previous.y) * t) * gridSize + gridSize / 2
                    });
                }
                return points;
            }

            function drawSnake(t) {
                const points = snakePoints(t);
                const total = points.length;

                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                // 身体：逐节描边，色相沿身体流动，越靠头部越亮越粗
                for (let i = total - 1; i >= 1; i--) {
                    const from = points[i];
                    const to = points[i - 1];
                    const toHead = 1 - (i - 0.5) / Math.max(total - 1, 1);
                    const hue = (186 + toHead * 150 + animTime * 36) % 360;
                    const light = 51 + 9 * Math.sin(animTime * 3.2 + i * 0.55);

                    ctx.strokeStyle = 'hsla(' + hue + ', 92%, ' + light + '%, 0.96)';
                    ctx.shadowColor = 'hsla(' + hue + ', 100%, 62%, 0.9)';
                    ctx.shadowBlur = 16;
                    ctx.lineWidth = gridSize * (0.40 + 0.26 * toHead);
                    ctx.beginPath();
                    ctx.moveTo(from.x, from.y);
                    ctx.lineTo(to.x, to.y);
                    ctx.stroke();
                }

                // 背部高光，让身体有立体感
                ctx.shadowBlur = 0;
                ctx.strokeStyle = 'rgba(255,255,255,0.16)';
                ctx.lineWidth = gridSize * 0.14;
                ctx.beginPath();
                ctx.moveTo(points[total - 1].x, points[total - 1].y);
                for (let i = total - 2; i >= 0; i--) {
                    ctx.lineTo(points[i].x, points[i].y);
                }
                ctx.stroke();

                drawHead(points);
            }

            function drawHead(points) {
                const head = points[0];
                const behind = points[1] || { x: head.x - dx * gridSize, y: head.y - dy * gridSize };
                const dir = unit(head.x - behind.x, head.y - behind.y);
                const side = { x: -dir.y, y: dir.x };
                const pulse = 1 + 0.05 * Math.sin(animTime * 7);
                const radius = gridSize * 0.47 * pulse;

                ctx.save();
                ctx.shadowColor = 'rgba(255,120,190,0.95)';
                ctx.shadowBlur = 28;
                const glow = ctx.createRadialGradient(
                    head.x - radius * 0.3, head.y - radius * 0.35, radius * 0.12,
                    head.x, head.y, radius
                );
                glow.addColorStop(0, '#ffffff');
                glow.addColorStop(0.35, '#ff9ad8');
                glow.addColorStop(1, '#ff2e9a');
                ctx.fillStyle = glow;
                ctx.beginPath();
                ctx.arc(head.x, head.y, radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                // 眼睛：深色瞳孔 + 白点高光，朝行进方向偏移
                const eyeR = gridSize * 0.105;
                const sep = gridSize * 0.2;
                const ox = head.x + dir.x * gridSize * 0.12;
                const oy = head.y + dir.y * gridSize * 0.12;

                for (const sign of [1, -1]) {
                    const ex = ox + side.x * sep * sign;
                    const ey = oy + side.y * sep * sign;

                    ctx.fillStyle = '#0b1020';
                    ctx.beginPath();
                    ctx.arc(ex, ey, eyeR, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(ex + dir.x * eyeR * 0.34, ey + dir.y * eyeR * 0.34, eyeR * 0.42, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            function drawFood() {
                const center = cellCenter(food);
                const pulse = 1 + 0.12 * Math.sin(animTime * 5.5);
                const radius = gridSize * 0.36 * pulse;

                // 旋转的虚线光环
                ctx.save();
                ctx.translate(center.x, center.y);
                ctx.rotate(animTime * 1.2);
                ctx.setLineDash([5, 7]);
                ctx.strokeStyle = 'rgba(255,214,102,0.6)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(0, 0, gridSize * 0.72, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();

                // 果实本体：多层径向渐变 + 外发光
                ctx.save();
                ctx.shadowColor = 'rgba(255,150,60,0.95)';
                ctx.shadowBlur = 26;
                const body = ctx.createRadialGradient(
                    center.x - radius * 0.35, center.y - radius * 0.4, radius * 0.1,
                    center.x, center.y, radius
                );
                body.addColorStop(0, '#fffbe8');
                body.addColorStop(0.35, '#ffd166');
                body.addColorStop(0.75, '#ff7a45');
                body.addColorStop(1, '#ff2e63');
                ctx.fillStyle = body;
                ctx.beginPath();
                ctx.arc(center.x, center.y, radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                // 高光
                ctx.fillStyle = 'rgba(255,255,255,0.85)';
                ctx.beginPath();
                ctx.arc(center.x - radius * 0.3, center.y - radius * 0.34, radius * 0.22, 0, Math.PI * 2);
                ctx.fill();

                // 叶子
                ctx.save();
                ctx.translate(center.x, center.y - radius * 0.92);
                ctx.rotate(Math.sin(animTime * 2) * 0.25 - 0.4);
                ctx.fillStyle = '#7ef29d';
                ctx.beginPath();
                ctx.ellipse(0, 0, gridSize * 0.17, gridSize * 0.075, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                // 环绕的小亮点
                for (let i = 0; i < 3; i++) {
                    const angle = animTime * 2 + i * Math.PI * 2 / 3;
                    const sx = center.x + Math.cos(angle) * gridSize * 0.92;
                    const sy = center.y + Math.sin(angle) * gridSize * 0.5;
                    const alpha = 0.3 + 0.7 * Math.abs(Math.sin(animTime * 3 + i));
                    ctx.fillStyle = 'rgba(255,240,180,' + alpha + ')';
                    ctx.beginPath();
                    ctx.arc(sx, sy, 1.9, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            function drawEffects() {
                ctx.save();

                rings.forEach(r => {
                    ctx.strokeStyle = 'hsla(' + r.hue + ', 100%, 70%, ' + Math.max(0, r.life) * 0.8 + ')';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
                    ctx.stroke();
                });

                particles.forEach(p => {
                    const alpha = Math.max(0, Math.min(1, p.life / p.maxLife));
                    ctx.fillStyle = 'hsla(' + p.hue + ', 100%, 68%, ' + alpha + ')';
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                });

                ctx.font = '700 ' + Math.round(gridSize * 0.8) + 'px "Segoe UI", system-ui, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                floaters.forEach(f => {
                    ctx.globalAlpha = Math.max(0, Math.min(1, f.life));
                    ctx.fillStyle = 'hsl(' + f.hue + ', 100%, 72%)';
                    ctx.shadowColor = 'hsl(' + f.hue + ', 100%, 60%)';
                    ctx.shadowBlur = 14;
                    ctx.fillText(f.text, f.x, f.y);
                    ctx.shadowBlur = 0;
                });
                ctx.globalAlpha = 1;

                ctx.restore();
            }

            function render(t) {
                drawBackground();

                ctx.save();
                if (shake > 0) {
                    ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
                }
                drawEffects();
                drawSnake(t);
                drawFood();
                ctx.restore();
            }

            /* ---------------- 主循环 ---------------- */
            function gameLoop(now) {
                if (!lastFrame) lastFrame = now;
                const dt = Math.min(now - lastFrame, 60);   // 切回标签页时不会一次补跑一大堆
                lastFrame = now;

                updateEffects(dt);

                if (gameRunning) {
                    stepProgress += dt / speed;
                    while (stepProgress >= 1 && gameRunning) {
                        stepProgress -= 1;
                        update();
                    }
                }

                render(gameRunning ? stepProgress : 1);
                requestAnimationFrame(gameLoop);
            }

            document.addEventListener('keydown', e => {
                if (!gameRunning) {
                    if (e.key === 'Enter' || e.key === ' ') {
                        resetGame();
                        e.preventDefault();
                    }
                    return;
                }

                switch (e.key) {
                    case 'ArrowUp':
                    case 'w':
                    case 'W':
                        if (dy !== 1) { nextDx = 0; nextDy = -1; }
                        e.preventDefault();
                        break;
                    case 'ArrowDown':
                    case 's':
                    case 'S':
                        if (dy !== -1) { nextDx = 0; nextDy = 1; }
                        e.preventDefault();
                        break;
                    case 'ArrowLeft':
                    case 'a':
                    case 'A':
                        if (dx !== 1) { nextDx = -1; nextDy = 0; }
                        e.preventDefault();
                        break;
                    case 'ArrowRight':
                    case 'd':
                    case 'D':
                        if (dx !== -1) { nextDx = 1; nextDy = 0; }
                        e.preventDefault();
                        break;
                }
            });

            resetGame();
            requestAnimationFrame(gameLoop);
        })();
    </script>
</body>
</html>
