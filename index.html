<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEON SNAKE · 霓虹贪吃蛇</title>
    <style>
        :root {
            --ink: #e8ecff;
            --muted: #8b93b8;
            --cyan: #22d3ee;
            --violet: #8b5cf6;
            --pink: #ff2e63;
            --gold: #ffd166;
            --orange: #ff8a3d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            align-items: stretch;
            justify-content: center;
            padding: 10px 12px 12px;
            color: var(--ink);
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
            background:
                radial-gradient(1100px 780px at 12% 8%, #17204a 0%, transparent 62%),
                radial-gradient(980px 720px at 88% 92%, #3a0f3d 0%, transparent 60%),
                linear-gradient(160deg, #05060f 0%, #0b0f24 55%, #060812 100%);
            overflow: hidden;
        }

        /* 背景里缓慢漂移的极光光斑 */
        .aurora {
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            opacity: .45;
            pointer-events: none;
            z-index: 0;
            animation: drift 20s ease-in-out infinite alternate;
        }
        .aurora.a { width: 420px; height: 420px; background: var(--cyan);   top: -90px;     left: -70px; }
        .aurora.b { width: 500px; height: 500px; background: var(--pink);   bottom: -160px; right: -90px; animation-duration: 26s; }
        .aurora.c { width: 360px; height: 360px; background: var(--violet); top: 42%;       left: 58%;   animation-duration: 32s; opacity: .32; }

        @keyframes drift {
            from { transform: translate3d(0, 0, 0) scale(1); }
            to   { transform: translate3d(70px, -46px, 0) scale(1.18); }
        }

        .game-shell {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            width: 100%;
            max-width: 1800px;
            height: 100%;
        }

        .title {
            font-size: clamp(1.5rem, 3vw, 2.4rem);
            font-weight: 800;
            letter-spacing: .18em;
            text-align: center;
            background: linear-gradient(90deg, var(--cyan), var(--violet), var(--pink), var(--gold), var(--cyan));
            background-size: 300% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: shimmer 7s linear infinite, titleIn .9s ease both;
        }

        @keyframes shimmer {
            to { background-position: 300% 0; }
        }

        @keyframes titleIn {
            from { opacity: 0; transform: translateY(-14px) scale(.96); }
            to   { opacity: 1; transform: none; }
        }

        .subtitle {
            margin-top: 6px;
            text-align: center;
            font-size: .78rem;
            letter-spacing: .08em;
            color: var(--muted);
        }

        .stats {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .stat {
            min-width: 96px;
            padding: 7px 16px;
            text-align: center;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, .09);
            background: rgba(255, 255, 255, .045);
            backdrop-filter: blur(8px);
            box-shadow: 0 10px 24px rgba(0, 0, 0, .3);
        }

        .stat .label {
            display: block;
            font-size: .64rem;
            letter-spacing: .2em;
            color: var(--muted);
        }

        .stat .value {
            display: block;
            margin-top: 2px;
            font-size: 1.3rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        #scoreCard .value { color: #7ef1ff; text-shadow: 0 0 16px rgba(126, 241, 255, .55); }
        #levelCard .value { color: #c4b5fd; text-shadow: 0 0 16px rgba(196, 181, 253, .55); }
        #highCard  .value { color: #ffd166; text-shadow: 0 0 16px rgba(255, 209, 102, .5); }
        #levelCard.p2 .value { color: #ffb066; text-shadow: 0 0 16px rgba(255, 176, 102, .55); }

        .stat.bump { animation: bump .45s ease; }

        @keyframes bump {
            0%   { transform: scale(1); }
            38%  { transform: scale(1.15); border-color: rgba(126, 241, 255, .65); box-shadow: 0 0 26px rgba(126, 241, 255, .45); }
            100% { transform: scale(1); }
        }

        .board {
            position: relative;
            flex: 1 1 auto;
            width: 100%;
            min-height: 240px;
            padding: 8px;
            border-radius: 20px;
            background: linear-gradient(145deg, rgba(34, 211, 238, .38), rgba(139, 92, 246, .38), rgba(255, 46, 99, .38));
            box-shadow: 0 26px 60px rgba(0, 0, 0, .55), 0 0 70px rgba(80, 120, 255, .16);
            animation: boardIn .85s ease both;
        }

        @keyframes boardIn {
            from { opacity: 0; transform: translateY(20px) scale(.97); }
            to   { opacity: 1; transform: none; }
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            border-radius: 15px;
            background: #0a0f26;
        }

        .overlay {
            position: absolute;
            inset: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 15px;
            background: rgba(5, 6, 15, .74);
            backdrop-filter: blur(7px);
            opacity: 0;
            visibility: hidden;
            transition: opacity .35s ease, visibility .35s ease;
        }

        .overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .panel {
            max-width: 100%;
            padding: 26px 40px;
            text-align: center;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, .12);
            background: rgba(12, 16, 38, .9);
            box-shadow: 0 20px 50px rgba(0, 0, 0, .55), 0 0 40px rgba(255, 46, 99, .22);
            transform: translateY(18px) scale(.93);
            transition: transform .4s cubic-bezier(.2, .9, .25, 1.2);
        }

        .overlay.show .panel {
            transform: none;
        }

        .badge {
            display: none;
            margin-bottom: 12px;
            padding: 4px 14px;
            border-radius: 999px;
            font-size: .66rem;
            font-weight: 800;
            letter-spacing: .22em;
            color: #14100a;
            background: linear-gradient(90deg, var(--gold), #a3e635);
        }

        .badge.show {
            display: inline-block;
            animation: badgePop .55s ease;
        }

        @keyframes badgePop {
            0%   { transform: scale(.5) rotate(-6deg); opacity: 0; }
            70%  { transform: scale(1.12) rotate(2deg); opacity: 1; }
            100% { transform: scale(1) rotate(0); }
        }

        .panel h2 {
            font-size: 2rem;
            letter-spacing: .16em;
            color: var(--pink);
            text-shadow: 0 0 22px rgba(255, 46, 99, .55);
        }

        .panel h2.menu-title {
            font-size: 1.7rem;
            color: #7ef1ff;
            text-shadow: 0 0 22px rgba(126, 241, 255, .5);
        }

        .menu-sub {
            margin: 10px 0 20px;
            font-size: .82rem;
            color: var(--muted);
        }

        .panel .final {
            margin: 12px 0 20px;
            font-size: 1rem;
            color: var(--muted);
        }

        .panel .final span {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--gold);
        }

        .panel .tip {
            margin-top: 14px;
            font-size: .74rem;
            color: var(--muted);
        }

        .btn {
            display: inline-block;
            padding: 12px 30px;
            border: none;
            border-radius: 999px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: .1em;
            color: #fff;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            background: linear-gradient(135deg, var(--cyan), var(--violet) 55%, var(--pink));
            box-shadow: 0 12px 28px rgba(139, 92, 246, .45);
            transition: transform .2s ease, box-shadow .2s ease;
        }

        .btn:hover {
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 18px 36px rgba(255, 46, 99, .42);
        }

        .btn:active {
            transform: translateY(0) scale(.98);
        }

        .btn.ghost {
            border: 1px solid rgba(255, 255, 255, .22);
            background: transparent;
            color: var(--ink);
            box-shadow: none;
        }

        .btn.ghost:hover {
            border-color: var(--cyan);
            color: #fff;
            box-shadow: 0 0 24px rgba(34, 211, 238, .35);
        }

        .panel-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .keymap {
            margin-top: 18px;
            padding-top: 14px;
            border-top: 1px solid rgba(255, 255, 255, .1);
            font-size: .76rem;
            line-height: 2.2;
            color: var(--muted);
        }

        .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            margin-right: 5px;
            border-radius: 50%;
            vertical-align: middle;
        }

        .dot.p1 { background: var(--cyan);   box-shadow: 0 0 10px rgba(34, 211, 238, .8); }
        .dot.p2 { background: var(--orange); box-shadow: 0 0 10px rgba(255, 138, 61, .8); }

        .duel-result {
            margin: 14px 0 20px;
        }

        .duel-line {
            margin: 6px 0;
            font-size: 1.05rem;
            color: var(--ink);
        }

        .duel-line b {
            font-size: 1.35rem;
            color: var(--gold);
            font-variant-numeric: tabular-nums;
        }

        .duel-line .cause {
            margin-left: 6px;
            font-size: .78rem;
            color: var(--muted);
        }

        .controls {
            font-size: .78rem;
            color: var(--muted);
            text-align: center;
            line-height: 1.8;
        }

        .controls .sep {
            margin: 0 8px;
            color: rgba(255, 255, 255, .22);
        }

        .controls a {
            padding-bottom: 1px;
            color: #7ef1ff;
            text-decoration: none;
            border-bottom: 1px solid rgba(126, 241, 255, .35);
            transition: color .2s ease, border-color .2s ease;
        }

        .controls a:hover {
            color: #fff;
            border-color: #fff;
        }

        kbd {
            display: inline-block;
            margin: 0 1px;
            padding: 1px 7px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, .16);
            border-bottom-width: 2px;
            background: rgba(255, 255, 255, .08);
            font-family: inherit;
            font-size: .78rem;
            color: var(--ink);
        }

        @media (prefers-reduced-motion: reduce) {
            .aurora, .title, .board, .stat.bump, .badge.show { animation: none; }
        }
    </style>
</head>
<body>
    <div class="aurora a"></div>
    <div class="aurora b"></div>
    <div class="aurora c"></div>

    <main class="game-shell">
        <header>
            <h1 class="title">NEON SNAKE</h1>
            <p class="subtitle">霓虹贪吃蛇 · 单人挑战与双人对战</p>
        </header>

        <section class="stats">
            <div class="stat" id="scoreCard"><span class="label" id="label1">SCORE</span><span class="value" id="value1">0</span></div>
            <div class="stat" id="levelCard"><span class="label" id="label2">LEVEL</span><span class="value" id="value2">1</span></div>
            <div class="stat" id="highCard"><span class="label" id="label3">BEST</span><span class="value" id="value3">0</span></div>
        </section>

        <section class="board">
            <canvas id="gameCanvas" width="600" height="600"></canvas>

            <div class="overlay show" id="startMenu">
                <div class="panel">
                    <h2 class="menu-title">选择模式</h2>
                    <p class="menu-sub">一个人刷分，或者两个人共用一把键盘对战</p>
                    <div class="panel-actions">
                        <button class="btn" type="button" onclick="startSolo()">单人模式</button>
                        <button class="btn ghost" type="button" onclick="startVersus()">双人对战</button>
                    </div>
                    <div class="keymap">
                        <p><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> 或 <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 控制方向（单人）</p>
                        <p><span class="dot p1"></span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 玩家 1 · <span class="dot p2"></span><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> 玩家 2</p>
                    </div>
                    <p class="tip">按 <kbd>1</kbd> 开始单人 · 按 <kbd>2</kbd> 开始对战</p>
                </div>
            </div>

            <div class="overlay" id="gameOver">
                <div class="panel">
                    <span class="badge" id="recordBadge">NEW RECORD</span>
                    <h2 id="resultTitle">GAME OVER</h2>
                    <p class="final" id="soloResult">本局得分 <span id="finalScore">0</span></p>
                    <div class="duel-result" id="versusResult" hidden>
                        <p class="duel-line"><span class="dot p1"></span>玩家 1 <b id="p1Score">0</b> 分<span class="cause" id="p1Cause"></span></p>
                        <p class="duel-line"><span class="dot p2"></span>玩家 2 <b id="p2Score">0</b> 分<span class="cause" id="p2Cause"></span></p>
                    </div>
                    <div class="panel-actions">
                        <button class="btn" type="button" onclick="restartRound()">再来一局</button>
                        <a class="btn ghost" href="scores.html">查看成绩记录</a>
                        <button class="btn ghost" type="button" onclick="showMenu()">换个模式</button>
                    </div>
                    <p class="tip">按 <kbd>Enter</kbd> 再来一局 · 按 <kbd>Esc</kbd> 回到模式选择</p>
                </div>
            </div>
        </section>

        <p class="controls">
            <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 玩家 1 · <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> 玩家 2 · <kbd>Esc</kbd> 回到模式选择
            <span class="sep">·</span>
            <a href="scores.html">查看成绩记录 →</a>
        </p>
    </main>

    <script>
        (function () {
            'use strict';

            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const startMenu = document.getElementById('startMenu');
            const gameOver = document.getElementById('gameOver');
            const recordBadge = document.getElementById('recordBadge');
            const resultTitle = document.getElementById('resultTitle');
            const soloResult = document.getElementById('soloResult');
            const finalScore = document.getElementById('finalScore');
            const versusResult = document.getElementById('versusResult');
            const p1Score = document.getElementById('p1Score');
            const p2Score = document.getElementById('p2Score');
            const p1Cause = document.getElementById('p1Cause');
            const p2Cause = document.getElementById('p2Cause');
            const scoreCard = document.getElementById('scoreCard');
            const levelCard = document.getElementById('levelCard');
            const highCard = document.getElementById('highCard');
            const label1 = document.getElementById('label1');
            const label2 = document.getElementById('label2');
            const label3 = document.getElementById('label3');
            const value1 = document.getElementById('value1');
            const value2 = document.getElementById('value2');
            const value3 = document.getElementById('value3');

            /* ---------------- 基础参数 ---------------- */
            const MIN_TILES = 20;                // 短边至少 20 格，长边按窗口比例延伸成长方形
            let cols = 20;                       // 横向格数
            let rows = 20;                       // 纵向格数
            let cell = 30;                       // 每格像素
            let offX = 0;                        // 网格在画布内的水平居中偏移
            let offY = 0;                        // 网格在画布内的垂直居中偏移
            let boardW = 600;                    // 画布逻辑宽度
            let boardH = 600;                    // 画布逻辑高度
            let scaleK = 1;                      // 相对 30px 格子的缩放系数，用于等比调整光效
            let boardReady = false;
            const START_SPEED = 130;             // 单人模式每步毫秒数，越小越快
            const MIN_SPEED = 65;
            const SPEED_STEP = 11;
            const LEVEL_STEP = 50;               // 每 50 分升一级
            const VERSUS_SPEED = 120;            // 对战模式固定速度，保证公平
            const FOOD_HUES = [45, 150, 285];    // 多个食物用不同色相区分
            const RECORDS_KEY = 'snakeRecords';
            const HIGH_SCORE_KEY = 'snakeHighScore';
            const MAX_RECORDS = 100;             // 只保留最近 100 场
            const CAUSE_TEXT = {
                wall: '撞墙',
                self: '咬到自己',
                other: '撞到对手',
                'head-on': '正面相撞'
            };

            // 每条蛇自己的配色，颜色沿身体流动
            const PALETTES = {
                solo: { hue: 186, spread: 150, glow: 'rgba(255,120,190,0.95)', head: ['#ffffff', '#ff9ad8', '#ff2e9a'] },
                p1:   { hue: 172, spread: 58,  glow: 'rgba(70,215,255,0.95)',  head: ['#ffffff', '#7ef1ff', '#17b6d8'] },
                p2:   { hue: 18,  spread: 52,  glow: 'rgba(255,150,70,0.95)',  head: ['#ffffff', '#ffc46b', '#ff5a2e'] }
            };

            /* ---------------- 游戏状态 ---------------- */
            let phase = 'menu';          // menu / playing / over
            let mode = 'solo';           // solo / versus
            let snakes = [];
            let foods = [];
            let speed = START_SPEED;
            let soloLevel = 1;
            let stepProgress = 1;
            let lastFrame = 0;
            let animTime = 0;
            let shake = 0;
            let particles = [];
            let rings = [];
            let floaters = [];
            let startedAt = 0;
            let clockSecond = -1;
            let roundStarted = false;    // 玩家按下第一个方向键后才真正开始移动
            let waitingSnakes = [];      // 还没按键确认的蛇
            let highScore = readHighScore();
            let bestAtStart = highScore;

            /* ---------------- 小工具 ---------------- */
            function unit(x, y) {
                const len = Math.hypot(x, y) || 1;
                return { x: x / len, y: y / len };
            }

            function bump(element) {
                element.classList.remove('bump');
                void element.offsetWidth;   // 强制重排，让动画能重新播放
                element.classList.add('bump');
            }

            function cellCenter(pos) {
                return {
                    x: offX + pos.x * cell + cell / 2,
                    y: offY + pos.y * cell + cell / 2
                };
            }

            function formatClock(seconds) {
                const m = Math.floor(seconds / 60);
                const s = seconds % 60;
                return m + ':' + (s < 10 ? '0' + s : s);
            }

            // 让棋盘铺满窗口：短边固定 MIN_TILES 格，长边按窗口比例延伸成长方形
            function resizeBoard(reshape) {
                const rect = canvas.getBoundingClientRect();
                const w = Math.max(320, Math.round(rect.width));
                const h = Math.max(240, Math.round(rect.height));
                if (boardReady && w === boardW && h === boardH && !reshape) return;

                boardW = w;
                boardH = h;

                // 对局进行中只缩放不重排格数，避免蛇的位置被瞬移
                if (reshape || !boardReady || phase !== 'playing') {
                    cell = Math.min(w, h) / MIN_TILES;
                    cols = Math.max(MIN_TILES, Math.floor(w / cell));
                    rows = Math.max(MIN_TILES, Math.floor(h / cell));
                } else {
                    cell = Math.min(w / cols, h / rows);
                }

                offX = (w - cols * cell) / 2;
                offY = (h - rows * cell) / 2;
                scaleK = cell / 30;
                boardReady = true;

                const dpr = Math.min(window.devicePixelRatio || 1, 2);
                canvas.width = Math.round(w * dpr);
                canvas.height = Math.round(h * dpr);
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            }

            function readHighScore() {
                try {
                    return Number(localStorage.getItem(HIGH_SCORE_KEY) || 0) || 0;
                } catch (e) {
                    return 0;
                }
            }

            function writeHighScore(value) {
                try {
                    localStorage.setItem(HIGH_SCORE_KEY, value);
                } catch (e) { /* 隐私模式下写不进去也无所谓 */ }
            }

            function loadRecords() {
                try {
                    const raw = localStorage.getItem(RECORDS_KEY);
                    const list = raw ? JSON.parse(raw) : [];
                    return Array.isArray(list) ? list : [];
                } catch (e) {
                    return [];
                }
            }

            function saveRecord(record) {
                try {
                    const list = loadRecords();
                    list.push(record);
                    localStorage.setItem(RECORDS_KEY, JSON.stringify(list.slice(-MAX_RECORDS)));
                } catch (e) { /* 存储满了就静默跳过，不影响游戏 */ }
            }

            /* ---------------- 计分板 ---------------- */
            function updateHud() {
                if (mode === 'versus') {
                    label1.textContent = '玩家 1';
                    label2.textContent = '玩家 2';
                    label3.textContent = '时长';
                    value1.textContent = snakes[0] ? snakes[0].score : 0;
                    value2.textContent = snakes[1] ? snakes[1].score : 0;
                    value3.textContent = elapsedText();
                    levelCard.classList.add('p2');
                } else {
                    label1.textContent = 'SCORE';
                    label2.textContent = 'LEVEL';
                    label3.textContent = 'BEST';
                    value1.textContent = snakes[0] ? snakes[0].score : 0;
                    value2.textContent = soloLevel;
                    value3.textContent = highScore;
                    levelCard.classList.remove('p2');
                }
            }

            function elapsedText() {
                if (phase !== 'playing' || !roundStarted) return value3.dataset.lastClock || '0:00';
                return formatClock(Math.max(0, Math.floor((Date.now() - startedAt) / 1000)));
            }

            /* ---------------- 棋盘元素 ---------------- */
            function makeSnake(name, cells, dir, palette) {
                return {
                    name: name,
                    palette: palette,
                    cells: cells.map(c => ({ x: c.x, y: c.y })),
                    prev: cells.map(c => ({ x: c.x, y: c.y })),
                    dir: { x: dir.x, y: dir.y },
                    next: { x: dir.x, y: dir.y },
                    alive: true,
                    cause: '',
                    score: 0
                };
            }

            function occupiedCells() {
                const occupied = new Set();
                snakes.forEach(s => s.cells.forEach(c => occupied.add(c.x + ',' + c.y)));
                foods.forEach(f => occupied.add(f.x + ',' + f.y));
                return occupied;
            }

            function freeCells() {
                const occupied = occupiedCells();
                const free = [];
                for (let x = 0; x < cols; x++) {
                    for (let y = 0; y < rows; y++) {
                        if (!occupied.has(x + ',' + y)) free.push({ x: x, y: y });
                    }
                }
                return free;
            }

            function addFood(index) {
                const free = freeCells();
                if (!free.length) return;
                const pick = free[Math.floor(Math.random() * free.length)];
                foods.push({ x: pick.x, y: pick.y, hue: FOOD_HUES[index % FOOD_HUES.length] });
            }

            function setupFoods(count) {
                foods = [];
                for (let i = 0; i < count; i++) addFood(i);
            }

            /* ---------------- 回合控制 ---------------- */
            function startRound(nextMode) {
                mode = nextMode;
                phase = 'playing';
                resizeBoard(true);       // 每局开始时按当前窗口重新排布格子
                roundStarted = false;
                startedAt = 0;
                clockSecond = -1;
                stepProgress = 0;
                shake = 0;
                particles = [];
                rings = [];
                floaters = [];
                bestAtStart = highScore;
                soloLevel = 1;

                const midRow = Math.floor(rows / 2);
                const midCol = Math.floor(cols / 2);
                const area = cols * rows;

                if (mode === 'versus') {
                    const gap = Math.max(3, Math.min(6, Math.floor(cols / 8)));
                    snakes = [
                        makeSnake('玩家 1', [{ x: midCol - gap, y: midRow }, { x: midCol - gap - 1, y: midRow }, { x: midCol - gap - 2, y: midRow }], { x: 1, y: 0 }, PALETTES.p1),
                        makeSnake('玩家 2', [{ x: midCol + gap, y: midRow }, { x: midCol + gap + 1, y: midRow }, { x: midCol + gap + 2, y: midRow }], { x: -1, y: 0 }, PALETTES.p2)
                    ];
                    speed = VERSUS_SPEED;
                    // 棋盘越大，食物越多，避免在空旷的长方形地图里到处找不到吃的
                    setupFoods(Math.max(3, Math.round(area / 200)));
                } else {
                    snakes = [makeSnake('玩家', [{ x: midCol, y: midRow }, { x: midCol - 1, y: midRow }, { x: midCol - 2, y: midRow }], { x: 1, y: 0 }, PALETTES.solo)];
                    speed = START_SPEED;
                    setupFoods(Math.max(1, Math.round(area / 400)));
                }

                // 开局先不动：等玩家按下第一个方向键再出发，避免还没反应过来就被蛇带着走
                waitingSnakes = mode === 'versus' ? [snakes[0], snakes[1]] : [snakes[0]];
                value3.dataset.lastClock = '0:00';
                startMenu.classList.remove('show');
                gameOver.classList.remove('show');
                recordBadge.classList.remove('show');
                updateHud();
            }

            function startSolo() { startRound('solo'); }
            function startVersus() { startRound('versus'); }
            function restartRound() { startRound(mode); }

            function showMenu() {
                phase = 'menu';
                stepProgress = 1;
                roundStarted = false;
                waitingSnakes = [];
                snakes = [];
                setupFoods(2);
                startMenu.classList.add('show');
                gameOver.classList.remove('show');
                updateHud();
            }

            /* ---------------- 输入 ---------------- */
            function setDirection(snake, dir) {
                if (!snake || !snake.alive) return;

                // 第一次按键即视为准备完成；对战时两位玩家都按过之后才一起出发
                const pending = waitingSnakes.indexOf(snake);
                if (pending >= 0) {
                    waitingSnakes.splice(pending, 1);
                    if (!waitingSnakes.length) beginMotion();
                }

                // 不允许 180° 掉头（以这一步实际行进的方向为准）
                if (snake.dir.x === -dir.x && snake.dir.y === -dir.y) return;
                snake.next = { x: dir.x, y: dir.y };
            }

            function beginMotion() {
                if (roundStarted) return;
                roundStarted = true;
                startedAt = Date.now();
                clockSecond = -1;
                value3.dataset.lastClock = '0:00';
            }

            function tickClock() {
                const elapsed = Math.max(0, Math.floor((Date.now() - startedAt) / 1000));
                if (elapsed === clockSecond) return;
                clockSecond = elapsed;
                const text = formatClock(elapsed);
                value3.dataset.lastClock = text;
                if (mode === 'versus') value3.textContent = text;
            }

            /* ---------------- 每步推进 ---------------- */
            // 两条蛇在同一拍里移动，所以先把所有新头算出来再统一判定碰撞
            function stepRound() {
                const active = snakes.filter(s => s.alive);
                if (!active.length) { endRound(); return; }

                // 记录上一步位置，用于插值出顺滑移动
                active.forEach(s => { s.prev = s.cells.map(c => ({ x: c.x, y: c.y })); });

                const heads = new Map();
                active.forEach(s => {
                    s.dir = { x: s.next.x, y: s.next.y };
                    heads.set(s, { x: s.cells[0].x + s.dir.x, y: s.cells[0].y + s.dir.y });
                });

                // 这一拍会吃到食物的蛇，尾巴保留
                const willEat = new Set();
                active.forEach(s => {
                    const head = heads.get(s);
                    if (foods.some(f => f.x === head.x && f.y === head.y)) willEat.add(s);
                });

                // 仍然被占用的格子：会移开的尾巴不算障碍
                const blocked = new Map();
                snakes.forEach(s => {
                    const keep = s.alive ? (willEat.has(s) ? s.cells.length : s.cells.length - 1) : s.cells.length;
                    for (let i = 0; i < keep; i++) {
                        blocked.set(s.cells[i].x + ',' + s.cells[i].y, s);
                    }
                });
                // 头也会在下一拍离开，所以头格不算障碍（换位相撞另行判定）
                active.forEach(s => blocked.delete(s.cells[0].x + ',' + s.cells[0].y));

                const deaths = new Map();
                active.forEach(s => {
                    const head = heads.get(s);
                    if (head.x < 0 || head.x >= cols || head.y < 0 || head.y >= rows) {
                        deaths.set(s, 'wall');
                        return;
                    }
                    const owner = blocked.get(head.x + ',' + head.y);
                    if (owner) deaths.set(s, owner === s ? 'self' : 'other');
                });

                // 两个头抢同一格，或者面对面换位，都算正面相撞
                for (let i = 0; i < active.length; i++) {
                    for (let j = i + 1; j < active.length; j++) {
                        const a = active[i];
                        const b = active[j];
                        const ha = heads.get(a);
                        const hb = heads.get(b);
                        const sameTarget = ha.x === hb.x && ha.y === hb.y;
                        const swapped = ha.x === b.cells[0].x && ha.y === b.cells[0].y &&
                                        hb.x === a.cells[0].x && hb.y === a.cells[0].y;
                        if (sameTarget || swapped) {
                            if (!deaths.has(a)) deaths.set(a, 'head-on');
                            if (!deaths.has(b)) deaths.set(b, 'head-on');
                        }
                    }
                }

                deaths.forEach((cause, snake) => killSnake(snake, cause));

                active.forEach(s => {
                    if (!s.alive) return;
                    const head = heads.get(s);
                    s.cells.unshift(head);
                    const index = foods.findIndex(f => f.x === head.x && f.y === head.y);
                    if (index >= 0) {
                        const eaten = foods.splice(index, 1)[0];
                        s.score += 10;
                        onEat(s, eaten);
                    } else {
                        s.cells.pop();
                    }
                });

                updateHud();
                if (snakes.some(s => !s.alive)) endRound();
            }

            function onEat(snake, food) {
                const pos = cellCenter(food);
                floaters.push({ x: pos.x, y: pos.y, text: '+10', life: 1, hue: food.hue });
                rings.push({ x: pos.x, y: pos.y, r: cell * 0.4, maxR: cell * 2.6, life: 1, hue: food.hue });
                spawnBurst(pos, 20, food.hue);

                if (mode === 'solo') {
                    if (snake.score > highScore) {
                        highScore = snake.score;
                        writeHighScore(highScore);
                        bump(highCard);
                    }
                    const nextLevel = 1 + Math.floor(snake.score / LEVEL_STEP);
                    if (nextLevel !== soloLevel) {
                        soloLevel = nextLevel;
                        bump(levelCard);
                        const center = { x: offX + cols * cell / 2, y: offY + rows * cell / 2 };
                        floaters.push({ x: center.x, y: center.y, text: 'LEVEL ' + soloLevel, life: 1.35, hue: 285 });
                        rings.push({ x: center.x, y: center.y, r: cell, maxR: Math.max(cols, rows) * cell * 0.5, life: 1, hue: 285 });
                    }
                    speed = Math.max(MIN_SPEED, START_SPEED - (soloLevel - 1) * SPEED_STEP);
                }

                bump(snake === snakes[0] ? scoreCard : levelCard);
                addFood(foods.length);
            }

            function killSnake(snake, cause) {
                snake.alive = false;
                snake.cause = cause;
                shake = Math.max(shake, 16);
                snake.cells.forEach((cell, index) => {
                    spawnBurst(cellCenter(cell), 7, (snake.palette.hue + index * 12) % 360);
                });
            }

            function endRound() {
                phase = 'over';
                stepProgress = 1;
                const duration = Math.max(1, Math.round((Date.now() - startedAt) / 1000));

                if (mode === 'solo') {
                    const snake = snakes[0];
                    saveRecord({
                        v: 1,
                        mode: 'solo',
                        endedAt: Date.now(),
                        duration: duration,
                        score: snake.score,
                        level: soloLevel,
                        length: snake.cells.length
                    });
                    finalScore.textContent = snake.score;
                    soloResult.hidden = false;
                    versusResult.hidden = true;
                    resultTitle.textContent = 'GAME OVER';
                    if (snake.score > 0 && snake.score >= bestAtStart) recordBadge.classList.add('show');
                } else {
                    const a = snakes[0];
                    const b = snakes[1];
                    const winner = (!a.alive && !b.alive) ? 0 : (a.alive ? 1 : 2);
                    saveRecord({
                        v: 1,
                        mode: 'versus',
                        endedAt: Date.now(),
                        duration: duration,
                        winner: winner,
                        players: [
                            { score: a.score, length: a.cells.length, cause: a.cause },
                            { score: b.score, length: b.cells.length, cause: b.cause }
                        ]
                    });
                    p1Score.textContent = a.score;
                    p2Score.textContent = b.score;
                    p1Cause.textContent = a.cause ? '（' + CAUSE_TEXT[a.cause] + '）' : '';
                    p2Cause.textContent = b.cause ? '（' + CAUSE_TEXT[b.cause] + '）' : '';
                    soloResult.hidden = true;
                    versusResult.hidden = false;
                    resultTitle.textContent = winner === 0 ? '平局' : (winner === 1 ? '玩家 1 获胜' : '玩家 2 获胜');
                }

                updateHud();
                gameOver.classList.add('show');
            }

            /* ---------------- 特效 ---------------- */
            function spawnBurst(pos, count, hue) {
                for (let i = 0; i < count; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const power = 40 + Math.random() * 150;
                    particles.push({
                        x: pos.x,
                        y: pos.y,
                        vx: Math.cos(angle) * power,
                        vy: Math.sin(angle) * power,
                        life: 0.5 + Math.random() * 0.5,
                        maxLife: 1,
                        size: (1.6 + Math.random() * 3.2) * scaleK,
                        hue: hue + (Math.random() * 50 - 25)
                    });
                }
            }

            function updateEffects(dt) {
                const seconds = dt / 1000;
                animTime += seconds;

                if (shake > 0.4) {
                    shake *= Math.pow(0.9, dt / 16);
                } else {
                    shake = 0;
                }

                const damp = Math.pow(0.94, dt / 16);
                particles = particles.filter(p => {
                    p.life -= seconds;
                    if (p.life <= 0) return false;
                    p.x += p.vx * seconds;
                    p.y += p.vy * seconds;
                    p.vx *= damp;
                    p.vy = p.vy * damp + 70 * seconds;
                    return true;
                });

                rings = rings.filter(r => {
                    r.life -= seconds * 1.7;
                    r.r += (r.maxR - r.r) * Math.min(1, seconds * 7);
                    return r.life > 0;
                });

                floaters = floaters.filter(f => {
                    f.life -= seconds * 1.05;
                    f.y -= 36 * seconds;
                    return f.life > 0;
                });
            }

            /* ---------------- 绘制 ---------------- */
            function drawBackground() {
                const gridW = cols * cell;
                const gridH = rows * cell;
                const gx = offX + gridW / 2;
                const gy = offY + gridH / 2;

                const gradient = ctx.createLinearGradient(0, 0, boardW, boardH);
                gradient.addColorStop(0, '#070a18');
                gradient.addColorStop(0.5, '#0a0f26');
                gradient.addColorStop(1, '#0c0722');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, boardW, boardH);

                // 中央缓缓呼吸的光晕
                const breathe = 0.1 + 0.035 * Math.sin(animTime * 0.9);
                const halo = ctx.createRadialGradient(gx, gy, 40, gx, gy, Math.max(boardW, boardH) * 0.6);
                halo.addColorStop(0, 'rgba(96,132,255,' + breathe + ')');
                halo.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = halo;
                ctx.fillRect(0, 0, boardW, boardH);

                // 网格：按实际格数与居中偏移绘制
                ctx.lineWidth = 1;
                ctx.strokeStyle = 'rgba(150,180,255,0.06)';
                ctx.beginPath();
                for (let i = 1; i < cols; i++) {
                    const p = offX + i * cell;
                    ctx.moveTo(p, offY);
                    ctx.lineTo(p, offY + gridH);
                }
                for (let j = 1; j < rows; j++) {
                    const p = offY + j * cell;
                    ctx.moveTo(offX, p);
                    ctx.lineTo(offX + gridW, p);
                }
                ctx.stroke();

                ctx.strokeStyle = 'rgba(150,180,255,0.13)';
                ctx.beginPath();
                for (let i = 5; i < cols; i += 5) {
                    const p = offX + i * cell;
                    ctx.moveTo(p, offY);
                    ctx.lineTo(p, offY + gridH);
                }
                for (let j = 5; j < rows; j += 5) {
                    const p = offY + j * cell;
                    ctx.moveTo(offX, p);
                    ctx.lineTo(offX + gridW, p);
                }
                ctx.stroke();

                // 活动区域外框，让长方形边界更清楚
                ctx.strokeStyle = 'rgba(150,180,255,0.2)';
                ctx.lineWidth = 1;
                ctx.strokeRect(offX + 0.5, offY + 0.5, gridW - 1, gridH - 1);

                // 自上而下缓缓扫过的光带
                const bandY = offY + ((animTime * 95) % (gridH + 260)) - 130;
                const band = ctx.createLinearGradient(0, bandY - 90, 0, bandY + 90);
                band.addColorStop(0, 'rgba(120,255,255,0)');
                band.addColorStop(0.5, 'rgba(120,255,255,0.055)');
                band.addColorStop(1, 'rgba(120,255,255,0)');
                ctx.fillStyle = band;
                ctx.fillRect(offX, bandY - 90, gridW, 180);
            }

            function snakePoints(snake, t) {
                const points = [];
                for (let i = 0; i < snake.cells.length; i++) {
                    const current = snake.cells[i];
                    const previous = i < snake.prev.length
                        ? snake.prev[i]
                        : snake.prev[snake.prev.length - 1] || current;
                    points.push({
                        x: offX + (previous.x + (current.x - previous.x) * t) * cell + cell / 2,
                        y: offY + (previous.y + (current.y - previous.y) * t) * cell + cell / 2
                    });
                }
                return points;
            }

            function drawSnake(snake, t) {
                const points = snakePoints(snake, t);
                const total = points.length;
                const palette = snake.palette;

                ctx.save();
                if (!snake.alive) ctx.globalAlpha = 0.3;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                // 身体：逐节描边，色相沿身体流动，越靠头部越亮越粗
                for (let i = total - 1; i >= 1; i--) {
                    const from = points[i];
                    const to = points[i - 1];
                    const toHead = 1 - (i - 0.5) / Math.max(total - 1, 1);
                    const hue = (palette.hue + toHead * palette.spread + animTime * 36) % 360;
                    const light = 51 + 9 * Math.sin(animTime * 3.2 + i * 0.55);

                    ctx.strokeStyle = 'hsla(' + hue + ', 92%, ' + light + '%, 0.96)';
                    ctx.shadowColor = 'hsla(' + hue + ', 100%, 62%, 0.9)';
                    ctx.shadowBlur = snake.alive ? 16 * scaleK : 0;
                    ctx.lineWidth = cell * (0.40 + 0.26 * toHead);
                    ctx.beginPath();
                    ctx.moveTo(from.x, from.y);
                    ctx.lineTo(to.x, to.y);
                    ctx.stroke();
                }

                // 背部高光，让身体有立体感
                ctx.shadowBlur = 0;
                ctx.strokeStyle = 'rgba(255,255,255,0.16)';
                ctx.lineWidth = cell * 0.14;
                ctx.beginPath();
                ctx.moveTo(points[total - 1].x, points[total - 1].y);
                for (let i = total - 2; i >= 0; i--) {
                    ctx.lineTo(points[i].x, points[i].y);
                }
                ctx.stroke();

                drawHead(points, snake);
                ctx.restore();
            }

            function drawHead(points, snake) {
                const head = points[0];
                const behind = points[1] || {
                    x: head.x - snake.dir.x * cell,
                    y: head.y - snake.dir.y * cell
                };
                const dir = unit(head.x - behind.x, head.y - behind.y);
                const side = { x: -dir.y, y: dir.x };
                const pulse = 1 + 0.05 * Math.sin(animTime * 7);
                const radius = cell * 0.47 * pulse;
                const head3 = snake.palette.head;

                ctx.save();
                ctx.shadowColor = snake.palette.glow;
                ctx.shadowBlur = snake.alive ? 28 * scaleK : 0;
                const glow = ctx.createRadialGradient(
                    head.x - radius * 0.3, head.y - radius * 0.35, radius * 0.12,
                    head.x, head.y, radius
                );
                glow.addColorStop(0, head3[0]);
                glow.addColorStop(0.35, head3[1]);
                glow.addColorStop(1, head3[2]);
                ctx.fillStyle = glow;
                ctx.beginPath();
                ctx.arc(head.x, head.y, radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                // 眼睛：深色瞳孔 + 白点高光，朝行进方向偏移
                const eyeR = cell * 0.105;
                const sep = cell * 0.2;
                const ox = head.x + dir.x * cell * 0.12;
                const oy = head.y + dir.y * cell * 0.12;

                for (const sign of [1, -1]) {
                    const ex = ox + side.x * sep * sign;
                    const ey = oy + side.y * sep * sign;

                    ctx.fillStyle = '#0b1020';
                    ctx.beginPath();
                    ctx.arc(ex, ey, eyeR, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(ex + dir.x * eyeR * 0.34, ey + dir.y * eyeR * 0.34, eyeR * 0.42, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            function drawFood(food) {
                const center = cellCenter(food);
                const hue = food.hue;
                const pulse = 1 + 0.12 * Math.sin(animTime * 5.5 + hue);
                const radius = cell * 0.36 * pulse;

                // 旋转的虚线光环
                ctx.save();
                ctx.translate(center.x, center.y);
                ctx.rotate(animTime * 1.2 + hue);
                ctx.setLineDash([5, 7]);
                ctx.strokeStyle = 'hsla(' + hue + ', 100%, 72%, 0.6)';
                ctx.lineWidth = 2 * scaleK;
                ctx.beginPath();
                ctx.arc(0, 0, cell * 0.72, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();

                // 果实本体：多层径向渐变 + 外发光
                ctx.save();
                ctx.shadowColor = 'hsla(' + hue + ', 100%, 60%, 0.95)';
                ctx.shadowBlur = 26 * scaleK;
                const body = ctx.createRadialGradient(
                    center.x - radius * 0.35, center.y - radius * 0.4, radius * 0.1,
                    center.x, center.y, radius
                );
                body.addColorStop(0, 'hsl(' + hue + ', 100%, 96%)');
                body.addColorStop(0.35, 'hsl(' + hue + ', 95%, 72%)');
                body.addColorStop(0.75, 'hsl(' + ((hue + 18) % 360) + ', 95%, 58%)');
                body.addColorStop(1, 'hsl(' + ((hue + 36) % 360) + ', 90%, 50%)');
                ctx.fillStyle = body;
                ctx.beginPath();
                ctx.arc(center.x, center.y, radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                // 高光
                ctx.fillStyle = 'rgba(255,255,255,0.85)';
                ctx.beginPath();
                ctx.arc(center.x - radius * 0.3, center.y - radius * 0.34, radius * 0.22, 0, Math.PI * 2);
                ctx.fill();

                // 叶子
                ctx.save();
                ctx.translate(center.x, center.y - radius * 0.92);
                ctx.rotate(Math.sin(animTime * 2 + hue) * 0.25 - 0.4);
                ctx.fillStyle = '#7ef29d';
                ctx.beginPath();
                ctx.ellipse(0, 0, cell * 0.17, cell * 0.075, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                // 环绕的小亮点
                for (let i = 0; i < 3; i++) {
                    const angle = animTime * 2 + i * Math.PI * 2 / 3 + hue;
                    const sx = center.x + Math.cos(angle) * cell * 0.92;
                    const sy = center.y + Math.sin(angle) * cell * 0.5;
                    const alpha = 0.3 + 0.7 * Math.abs(Math.sin(animTime * 3 + i));
                    ctx.fillStyle = 'hsla(' + hue + ', 100%, 92%, ' + alpha + ')';
                    ctx.beginPath();
                    ctx.arc(sx, sy, 1.9 * scaleK, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            function drawEffects() {
                ctx.save();

                rings.forEach(r => {
                    ctx.strokeStyle = 'hsla(' + r.hue + ', 100%, 70%, ' + Math.max(0, r.life) * 0.8 + ')';
                    ctx.lineWidth = 3 * scaleK;
                    ctx.beginPath();
                    ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
                    ctx.stroke();
                });

                particles.forEach(p => {
                    const alpha = Math.max(0, Math.min(1, p.life / p.maxLife));
                    ctx.fillStyle = 'hsla(' + p.hue + ', 100%, 68%, ' + alpha + ')';
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                });

                ctx.font = '700 ' + Math.round(cell * 0.8) + 'px "Segoe UI", system-ui, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                floaters.forEach(f => {
                    ctx.globalAlpha = Math.max(0, Math.min(1, f.life));
                    ctx.fillStyle = 'hsl(' + f.hue + ', 100%, 72%)';
                    ctx.shadowColor = 'hsl(' + f.hue + ', 100%, 60%)';
                    ctx.shadowBlur = 14;
                    ctx.fillText(f.text, f.x, f.y);
                    ctx.shadowBlur = 0;
                });
                ctx.globalAlpha = 1;

                ctx.restore();
            }

            function render(t) {
                drawBackground();

                ctx.save();
                if (shake > 0) {
                    ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
                }
                drawEffects();
                snakes.forEach(snake => drawSnake(snake, t));
                foods.forEach(food => drawFood(food));
                if (phase === 'playing' && !roundStarted) drawWaitingHint();
                ctx.restore();
            }

            // 开局前盖在棋盘中央的提示：告诉玩家按下方向键才会开始移动
            function drawWaitingHint() {
                const gridW = cols * cell;
                const gridH = rows * cell;
                const cx = offX + gridW / 2;
                // 放在偏上位置，避免挡住位于棋盘中央的初始蛇身
                const cy = offY + gridH * 0.34;
                const versus = mode === 'versus';
                const bandHeight = gridH * 0.26;

                ctx.save();
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                const band = ctx.createLinearGradient(0, cy - bandHeight / 2, 0, cy + bandHeight / 2);
                band.addColorStop(0, 'rgba(6,9,20,0)');
                band.addColorStop(0.5, 'rgba(6,9,20,0.8)');
                band.addColorStop(1, 'rgba(6,9,20,0)');
                ctx.fillStyle = band;
                ctx.fillRect(offX, cy - bandHeight / 2, gridW, bandHeight);

                ctx.font = '700 ' + Math.round(26 * scaleK) + 'px "Segoe UI", "PingFang SC", system-ui, sans-serif';
                ctx.fillStyle = '#e8ecff';
                ctx.shadowColor = 'rgba(126,241,255,0.7)';
                ctx.shadowBlur = 20 * scaleK;
                ctx.fillText(versus ? '双方各按一次方向键开始' : '按方向键开始', cx, cy - 18 * scaleK);
                ctx.shadowBlur = 0;

                ctx.font = '500 ' + Math.round(14 * scaleK) + 'px "Segoe UI", "PingFang SC", system-ui, sans-serif';
                ctx.fillStyle = 'rgba(200,210,240,0.78)';
                ctx.fillText(
                    versus ? '玩家 1 用 WASD · 玩家 2 用方向键' : '方向键 或 WASD，按下后蛇才会移动',
                    cx, cy + 14 * scaleK
                );

                if (versus) {
                    const ready1 = snakes[0] && waitingSnakes.indexOf(snakes[0]) < 0;
                    const ready2 = snakes[1] && waitingSnakes.indexOf(snakes[1]) < 0;
                    ctx.font = '600 ' + Math.round(13 * scaleK) + 'px "Segoe UI", "PingFang SC", system-ui, sans-serif';
                    ctx.fillStyle = ready1 ? '#7ef1ff' : 'rgba(160,170,200,0.65)';
                    ctx.fillText('玩家 1 ' + (ready1 ? '已就绪' : '等待中'), cx - gridW * 0.17, cy + 46 * scaleK);
                    ctx.fillStyle = ready2 ? '#ffb066' : 'rgba(160,170,200,0.65)';
                    ctx.fillText('玩家 2 ' + (ready2 ? '已就绪' : '等待中'), cx + gridW * 0.17, cy + 46 * scaleK);
                }

                ctx.restore();
            }

            /* ---------------- 主循环 ---------------- */
            function gameLoop(now) {
                if (!lastFrame) lastFrame = now;
                const dt = Math.min(now - lastFrame, 60);   // 切回标签页时不会一次补跑一大堆
                lastFrame = now;

                updateEffects(dt);

                if (phase === 'playing' && roundStarted) {
                    tickClock();
                    stepProgress += dt / speed;
                    while (stepProgress >= 1 && phase === 'playing') {
                        stepProgress -= 1;
                        stepRound();
                    }
                }

                render(phase === 'playing' ? stepProgress : 1);
                requestAnimationFrame(gameLoop);
            }

            /* ---------------- 键盘 ---------------- */
            const DIRS = {
                ArrowUp: { x: 0, y: -1 },
                ArrowDown: { x: 0, y: 1 },
                ArrowLeft: { x: -1, y: 0 },
                ArrowRight: { x: 1, y: 0 },
                w: { x: 0, y: -1 },
                s: { x: 0, y: 1 },
                a: { x: -1, y: 0 },
                d: { x: 1, y: 0 }
            };

            document.addEventListener('keydown', e => {
                const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;

                if (phase === 'menu') {
                    if (key === '1' || key === 'Enter' || key === ' ') { startSolo(); e.preventDefault(); }
                    else if (key === '2') { startVersus(); e.preventDefault(); }
                    return;
                }

                if (phase === 'over') {
                    if (key === 'Enter' || key === ' ') { restartRound(); e.preventDefault(); }
                    else if (key === '1') { startSolo(); e.preventDefault(); }
                    else if (key === '2') { startVersus(); e.preventDefault(); }
                    else if (key === 'Escape') { showMenu(); e.preventDefault(); }
                    return;
                }

                if (key === 'Escape') { showMenu(); e.preventDefault(); return; }

                const dir = DIRS[key];
                if (!dir) return;
                e.preventDefault();

                if (mode === 'versus') {
                    // WASD 归玩家 1，方向键归玩家 2
                    const isArrow = key.startsWith('Arrow');
                    setDirection(snakes[isArrow ? 1 : 0], dir);
                } else {
                    setDirection(snakes[0], dir);
                }
            });

            /* ---------------- 启动 ---------------- */
            window.startSolo = startSolo;
            window.startVersus = startVersus;
            window.restartRound = restartRound;
            window.showMenu = showMenu;

            resizeBoard(true);
            window.addEventListener('resize', function () { resizeBoard(false); });
            showMenu();
            requestAnimationFrame(gameLoop);
        })();
    </script>
</body>
</html>
